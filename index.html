<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0e">
  <meta name="description" content="In loving memory of Joseph S. Hayden, May 30, 1942 – July 26, 2026.">
  <title>In Loving Memory of Joseph S. Hayden</title>
  <link rel="preload" href="assets/joseph-hayden.webp" as="image" type="image/webp">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <main class="memorial">
    <header class="intro">
      <p class="eyebrow">In Loving Memory</p>
      <h1>Joseph S. Hayden</h1>
      <p class="dates">
        <time datetime="1942-05-30">May 30, 1942</time>
        <span aria-hidden="true">—</span>
        <time datetime="2026-07-26">July 26, 2026</time>
      </p>
    </header>

    <section class="portrait-wrap" aria-label="Memorial portrait">
      <div class="portrait-frame">
        <img src="assets/joseph-hayden.webp" alt="Portrait of Joseph S. Hayden" width="224" height="344">
      </div>
    </section>

    <section class="tribute" aria-labelledby="tribute-heading">
      <h2 id="tribute-heading">Forever in our hearts</h2>
      <p>A life remembered with love. A presence deeply missed. A light that will remain with us always.</p>
    </section>

    <div class="candles" aria-hidden="true">
      <div class="candle candle--small" style="--delay:-.8s"><span class="flame"></span><span class="wick"></span></div>
      <div class="candle" style="--delay:-1.7s"><span class="flame"></span><span class="wick"></span></div>
      <div class="candle candle--tall" style="--delay:-.3s"><span class="flame"></span><span class="wick"></span></div>
      <div class="candle" style="--delay:-1.2s"><span class="flame"></span><span class="wick"></span></div>
      <div class="candle candle--small" style="--delay:-2.1s"><span class="flame"></span><span class="wick"></span></div>
    </div>
  </main>
  <footer>May his memory be a blessing.</footer>
</body>
</html>
